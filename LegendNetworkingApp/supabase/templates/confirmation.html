<!-- Legend — signup confirmation.
     Leads with a CODE, not a link: people routinely sign up on one device and
     read email on another, and a link only works on the device that opens it.
     The link is kept as a same-device convenience, below the fold. -->
<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#11161d;">
  <h1 style="font-size:22px;margin:0 0 8px;">Confirm your email</h1>
  <p style="margin:0 0 24px;color:#5b6472;">Enter this code in Legend to finish creating your account.</p>

  <div style="background:#0B0D12;border-radius:12px;padding:24px;text-align:center;margin-bottom:24px;">
    <div style="font-size:34px;letter-spacing:10px;font-weight:700;color:#ffffff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">{{ .Token }}</div>
  </div>

  <p style="margin:0 0 24px;color:#5b6472;font-size:14px;">
    The code expires in one hour. If you didn't create a Legend account, you can ignore this email.
  </p>

  <p style="margin:0;color:#8b95a5;font-size:13px;">
    Opening this on the same device you signed up on?
    <a href="{{ .ConfirmationURL }}" style="color:#4C8BF5;">Confirm with one tap instead</a>.
  </p>
</div>
