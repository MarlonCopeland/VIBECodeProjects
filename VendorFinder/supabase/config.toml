# Supabase CLI project config for Vendor Finder.
#
# `supabase config push` syncs this [auth] block to the linked project, so it
# is the source of truth for redirect handling and email templates. Anything
# omitted here reverts to the CLI's default on the next push.
#
# Outgoing mail goes through Resend via custom SMTP, configured in the
# dashboard (Authentication -> Emails -> SMTP Settings) so the API key never
# lives in the repo. There is deliberately no [auth.email.smtp] block here.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "vendorfinder"

[auth]
enable_signup = true

# Where Supabase sends people when an email link has no explicit (allow-listed)
# redirect. Defaults to http://localhost:3000, which dead-ends on a phone, so
# the fallback is the app's own scheme.
site_url = "vendorfinder://"

# Every redirect the app actually asks for must be allow-listed, or Supabase
# silently swaps it for site_url:
#   vendorfinder://**        - release / dev-client builds (scheme from app.config.js)
#   exp://**                 - Expo Go, whose tunnel host changes on every restart
#   http://localhost:8081/** - the Expo web build
#   http://localhost:8082/** - the web build when 8081 is taken by another app
# Trim the exp:// and localhost entries before going public.
additional_redirect_urls = [
  "vendorfinder://**",
  "exp://**",
  "http://localhost:8081/**",
  "http://localhost:8082/**",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
# Require users to confirm their email before a session is issued.
enable_confirmations = true
# Pinned to the project's existing values. `config push` sends the whole
# [auth] block, so anything left unset silently reverts to the CLI default
# (6-digit codes, and a 1s resend throttle that would let one address burn
# through the shared Resend quota).
otp_length = 8
max_frequency = "1m0s"

# Authenticator-app MFA was enabled on the project; keep it that way.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# The reset email leads with {{ .Token }} (a one-time code) rather than a link:
# a link only works on the device that opens it, and the PKCE code verifier it
# needs lives on the device that asked for the reset. The link is kept as a
# same-device shortcut.
[auth.email.template.recovery]
subject = "Reset your Vendor Finder password"
content_path = "./supabase/templates/recovery.html"
