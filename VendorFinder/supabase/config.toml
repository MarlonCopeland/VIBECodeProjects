# Minimal Supabase CLI project config for Vendor Finder.
# Run `supabase init` in your own project to generate the full file; this is a
# starting point. Docs: https://supabase.com/docs/guides/cli/config

project_id = "vendorfinder"

[auth]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Require users to confirm their email before a session is issued.
enable_confirmations = true
